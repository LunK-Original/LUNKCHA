<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Guide — LUNKCHA by LUNK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b; --bg-raise:#141416; --panel:#18181b; --panel-border:#2a2a2e;
    --text:#f2f2f3; --text-dim:#9a9aa2; --text-faint:#6b6b72;
    --blue:#2f9bff; --blue-deep:#0d6efd;
    --ok:#3ecf6e;
    --sans:'Inter', system-ui, sans-serif; --mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; border:none; cursor:pointer; }
  ::selection{ background:#1d5fae; color:#fff; }
  :focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }

  .nav{
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    height:60px; padding:0 28px;
    background:rgba(10,10,11,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--panel-border);
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; border-radius:6px; padding:6px 8px; margin-left:-8px; transition:background .15s; }
  .brand:hover{ background:var(--bg-raise); }
  .brand-mark{ width:26px; height:26px; flex-shrink:0; }
  .btn-download{
    background:var(--blue); color:#fff; font-weight:600; font-size:14px;
    padding:9px 18px; border-radius:8px; display:flex; align-items:center; gap:8px;
    transition:background .2s;
  }
  .btn-download:hover{ background:var(--blue-deep); }

  .hero{ padding:64px 24px 20px; text-align:center; max-width:760px; margin:0 auto; }
  .eyebrow{ font-family:var(--mono); font-size:12px; color:var(--blue); letter-spacing:1.5px; text-transform:uppercase; font-weight:600; }
  .hero h1{ font-size:clamp(30px,5vw,50px); font-weight:800; margin-top:12px; letter-spacing:-1px; }
  .hero p{ margin-top:16px; color:var(--text-dim); font-size:16px; line-height:1.6; }

  .video-wrap{
    max-width:820px; margin:44px auto 100px; padding:0 24px;
  }
  .video-panel{
    background:#0e0e10; border:1px solid var(--panel-border); border-radius:14px; overflow:hidden;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.7);
  }
  .video-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; background:#141416; border-bottom:1px solid var(--panel-border);
    font-size:12px; color:var(--text-faint); font-family:var(--mono);
  }
  .video-stage{
    position:relative; aspect-ratio:16/9;
    background:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:24px 24px; background-color:#0e0e10;
    display:flex; align-items:center; justify-content:center;
  }
  .video-stage video{ width:100%; height:100%; object-fit:cover; display:block; }

  .footer{ border-top:1px solid var(--panel-border); padding:36px 24px; text-align:center; color:var(--text-faint); font-size:12.5px; }
  .footer a{ text-decoration:underline; }
</style>
</head>
<body>

  <nav class="nav">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 26 26" fill="none">
        <path d="M13 1 L25 7 V19 L13 25 L1 19 V7 Z" fill="none" stroke="#2f9bff" stroke-width="1.6"/>
        <path d="M13 1 V25 M1 7 L25 19 M25 7 L1 19" stroke="#2f9bff" stroke-width="1" opacity=".45"/>
      </svg>
      LUNK
    </a>
    <a class="btn-download" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13m0 0l-5-5m5 5l5-5M4 21h16"/></svg>
      Download
    </a>
  </nav>

  <section class="hero">
    <div class="eyebrow">Setup Guide</div>
    <h1>Set up LUNKCHA in 3 minutes</h1>
    <p>From download to a moving character in your scene. Watch the video below.</p>
  </section>

  <div class="video-wrap">
    <div class="video-panel">
      <div class="video-head"><span>▶ LUNKCHA</span><span>setup walkthrough · 3:15</span></div>
      <div class="video-stage">
        <video autoplay muted playsinline loop preload="none" poster="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='960' height='540'><rect width='960' height='540' fill='%230e0e10'/><text x='480' y='275' font-family='monospace' font-size='18' fill='%23555' text-anchor='middle'>place setup tutorial video here</text></svg>">
          <source src="/video/tutorial.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </div>

  <footer class="footer">
    LUNKCHA by LUNK · v0.1.0 Early Access · <a href="godot-controller-kit.html">← Back to main page</a>
  </footer>

</body>
</html>
